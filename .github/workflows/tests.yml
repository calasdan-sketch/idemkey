name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  mcp:
    # The MCP integration tests are skipped when the SDK is absent; this job
    # makes sure they actually run, against both major SDK lines.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest "${{ matrix.mcp }}"
      - run: python -m pytest -q -rs
      - name: fail if any MCP test was skipped
        run: |
          python -m pytest -q -rs -k "mcp" | tee out.txt
          ! grep -q "SKIPPED" out.txt

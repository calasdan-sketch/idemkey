[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idemkey"
version = "0.1.1"
description = "Drop-in idempotency keys for agent tool calls: dedup, safe retry, partial-success verification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Calas Automations Inc." }]
keywords = ["idempotency", "agents", "mcp", "retry", "dedup", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
idemkey = "idemkey.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["idemkey*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

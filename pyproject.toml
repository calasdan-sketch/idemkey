[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "idemkey"
version = "0.3.0"
description = "Drop-in idempotency keys for agent tool calls: dedup, safe retry, partial-success verification"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
keywords = ["idempotency", "idempotency-key", "agents", "mcp", "retry", "dedup", "tools", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
idemkey = "idemkey.cli:main"

[tool.setuptools.package-data]
idemkey = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["idemkey*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
